name: Control Room CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/control-room-ci.yml"
      - ".node-version"
      - ".python-version"
      - "apps/control-room/**"
      - "assets/generated/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "profile/**"
      - "pyproject.toml"
      - "scripts/control_room_*.sh"
      - "scripts/profile_*.sh"
      - "src/profile_system/**"
      - "tests/**"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/control-room-ci.yml"
      - ".node-version"
      - ".python-version"
      - "apps/control-room/**"
      - "assets/generated/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "profile/**"
      - "pyproject.toml"
      - "scripts/control_room_*.sh"
      - "scripts/profile_*.sh"
      - "src/profile_system/**"
      - "tests/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install system verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxml2-utils \
            shellcheck

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for browser acceptance
        run: |
          pnpm --filter @michal-planeta/control-room exec \
            playwright install --with-deps chromium

      - name: Run repository verification
        run: pnpm control-room:check
