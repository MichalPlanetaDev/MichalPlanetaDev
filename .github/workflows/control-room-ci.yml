name: Control Room CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/control-room-ci.yml"
      - ".node-version"
      - "apps/control-room/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "profile/design-tokens.json"
      - "profile/profile.json"
      - "scripts/control_room_check.sh"
      - "tests/shell/control_room_check_test.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/control-room-ci.yml"
      - ".node-version"
      - "apps/control-room/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "profile/design-tokens.json"
      - "profile/profile.json"
      - "scripts/control_room_check.sh"
      - "tests/shell/control_room_check_test.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install shell verification tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for browser acceptance
        run: |
          pnpm --filter @michal-planeta/control-room exec \
            playwright install --with-deps chromium

      - name: Run repository verification
        run: pnpm control-room:check
