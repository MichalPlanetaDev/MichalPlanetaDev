<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Static SVG Surface Probe">
  <title>Static SVG Surface Probe</title>
  <defs>
    <linearGradient id="background-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07101d" stop-opacity="1" />
      <stop offset="52%" stop-color="#0b1927" stop-opacity="1" />
      <stop offset="100%" stop-color="#08121b" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="sample-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#54e3d3" stop-opacity="1" />
      <stop offset="100%" stop-color="#4f78ff" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="planet-gradient" cx="42%" cy="35%" r="66%">
      <stop offset="0%" stop-color="#c8fff7" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#5ea8ca" stop-opacity="0.86" />
      <stop offset="100%" stop-color="#182d4f" stop-opacity="0.42" />
    </radialGradient>
    <linearGradient id="mask-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </linearGradient>
    <clipPath id="sample-clip">
      <circle cx="0" cy="0" r="38" />
    </clipPath>
    <mask id="sample-mask" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="1" fill="url(#mask-gradient)" />
    </mask>
    <filter id="sample-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="url(#background-gradient)" />
  <circle cx="1080" cy="48" r="170" fill="url(#planet-gradient)" opacity="0.32" />
