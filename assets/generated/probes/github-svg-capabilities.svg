  <text x="60" y="50" fill="#d7f5f1" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="650" letter-spacing="2.2">STATIC SVG SURFACE PROBE</text>
  <text x="60" y="78" fill="#668b9d" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="550" letter-spacing="1.4">DETERMINISTIC / STATIC / REPOSITORY-OWNED</text>
  <text x="1025" y="67" fill="#75eadf" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="650" letter-spacing="2">09</text>
