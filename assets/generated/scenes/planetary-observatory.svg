  <title id="renderer-kernel-title">Planetary Observatory Scene System</title>
  <desc id="renderer-kernel-description">A deterministic static observatory interior framing a ringed planet, star field, structural window, command console and holographic table.</desc>
  <defs>
    <linearGradient id="scene-background-gradient" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#05080d" stop-opacity="1" />
      <stop offset="58%" stop-color="#07101d" stop-opacity="1" />
      <stop offset="100%" stop-color="#0b1826" stop-opacity="1" />
    </linearGradient>
    <radialGradient cx="34%" cy="28%" id="scene-planet-gradient" r="72%">
