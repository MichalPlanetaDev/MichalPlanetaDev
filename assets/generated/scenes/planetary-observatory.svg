    <linearGradient id="scene-console-gradient" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#102436" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#05080d" stop-opacity="0.98" />
    </linearGradient>
    <filter height="200%" id="scene-signal-glow" width="200%" x="-50%" y="-50%">
      <feGaussianBlur result="kernel-blur" stdDeviation="5" />
      <feMerge>
        <feMergeNode in="kernel-blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter height="200%" id="scene-planet-glow" width="200%" x="-50%" y="-50%">
      <feGaussianBlur result="kernel-blur" stdDeviation="8" />
      <feMerge>
        <feMergeNode in="kernel-blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
