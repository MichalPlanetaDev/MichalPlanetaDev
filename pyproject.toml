[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "michal-planeta-profile-system"
version = "0.1.0"
description = "Repository-owned GitHub profile publication system."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
profile-system = "profile_system.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/profile_system"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/profile_system"]
